
services:
  gobstuf-dev:
    build:
      context: src
      target: application
    ports:
      # No OAuth2 Proxy
      - "8165:8001"
      # With oauth2-proxy
      #   Set cookie_secure in oauth2-proxy.cfg to false
      #   Uncomment UWSGI_ATTACH_DAEMON2
      # - "8165:8000"
    container_name: gobstuf
    environment:
#      UWSGI_ATTACH_DAEMON2: "cmd=./oauth2-proxy --config oauth2-proxy.cfg,freq=3,control=true,stopsignal=15"
      UWSGI_BUFFER_SIZE: "8192"
      UWSGI_CALLABLE: "app"
      UWSGI_DIE_ON_TERM: "1"
      UWSGI_ENABLE_THREADS: ""
      UWSGI_HARAKIRI: "3600"
      UWSGI_HTTP: ":8001"
      UWSGI_HTTP_TIMEOUT: "4000"
      UWSGI_LOG_DRAIN: ".*\\/brp\\/status\\/health\\/.*"
      UWSGI_MAX_REQUESTS: 100  # Restart workers after this many requests
      UWSGI_MODULE: "gobstuf.wsgi"
      UWSGI_NEED_APP: "1"
      UWSGI_PROCESSES: "4"
      UWSGI_RELOAD_ON_RSS: "512"
      UWSGI_SINGLE_INTERPRETER: "1"
      UWSGI_STRICT: "1"
      UWSGI_VACUUM: "1"

      API_BASE_PATH: /gob_stuf_test  # raw xml response endpoint
      HC_BASE_PATH:
      ROUTE_PATH_310: /310
      ROUTE_PATH_204: /204
      ROUTE_SCHEME: https
      ROUTE_NETLOC: gob-stuf-tests:1234

      GOB_STUF_PORT: 8000
      CLIENT_CERT_CRT: cert.crt
      CLIENT_CERT_KEY: cert.key

#      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID}
#      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
#      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
#      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OAUTH2_PROXY_OIDC_ISSUER_URL}
#      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_PROXY_REDIRECT_URL}

  gobstuf-test:
    build:
      context: src
      target: test

  gobstuf-app:
    build:
      context: src
      target: application
    image: ${REGISTRY:-localhost:5000}/${REPOSITORY:-brpproxy/gobstuf}:${VERSION:-latest}
