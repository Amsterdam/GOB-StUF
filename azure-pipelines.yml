trigger: none

jobs:
  - job: test
    displayName: Run tests
    pool:
      name: ContainerBuilder
      #        DISABLE SADA -> fw currently blocks debian apt-get (470)
      #        name: Selfhosted Azure Devops Agents
    steps:
      - checkout: self

      - script: docker compose build --no-cache gobstuf-test
        displayName: Build

      - script: docker compose run gobstuf-test
        displayName: Run

      - script: docker compose down && docker builder prune --force
        condition: succeededOrFailed()
        displayName: Cleanup
