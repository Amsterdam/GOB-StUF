# Default keyvault for getting secrets
keyVaultName: brpproxy-o-lnqqy7depr3ry

# Managed identity (clientId) for workload identity with
workloadIdentity: 4011c161-8b44-4f48-b68d-276a9cc467b1

image:
  repository: brpproxy/gobstuf

# We must select the nodepool to run the pods on
nodepool: cccbenkont01

# Default host for the ingress resources
host: brpproxy.benk-o.azure.amsterdam.nl

# Specify the keyvault that has the certificate
secrets:
  certificate:
    keyVaultName: shared-o-wf5pflasngroi

  vault:
    type: keyvault
    annotations:
      helm.sh/hook-weight: "-5"
    secrets:
      # Keycloak (used as env var by proxy)
      - oauth2-proxy-client-id
      - oauth2-proxy-client-secret
      - oauth2-proxy-cookie-secret
      - oauth2-proxy-oidc-issuer-url

      # Dev only: Entra ID (used in oauth2-proxy-entra.yml)
      - oauth2-proxy-entra-client-id
      - oauth2-proxy-entra-client-secret
      - oauth2-proxy-entra-cookie-secret
      - oauth2-proxy-entra-oidc-issuer-url

deployments:
  api:
    env:
      ROUTE_NETLOC: mks01.acc.amsterdam.nl:8443
      OAUTH2_PROXY_WHITELIST_DOMAINS: brpproxy.benk-o.azure.amsterdam.nl,*.ont.bp.data.amsterdam.nl

services:
  entra:
    selector:
      component: api
    ports:
      - name: entra
        protocol: TCP
        port: 7999
        targetPort: entra
  keycloak:
    selector:
      component: api
    ports:
      - name: keycloak
        port: 8000
        targetPort: keycloak

# Define internal ingress (no external)
# - ont.bp.data.amsterdam.nl
ingress:
  backend-internal:
    host: ont.bp.data.amsterdam.nl
    className: nginx-internal
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
      # Shows outgoing ip for appgw, needs header rewrite
      nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
      nginx.ingress.kubernetes.io/compute-full-forwarded-for: "true"
    paths:
      # Entra ID
      - path: /entra/brp
        service: entra
        port: 7999
      # Keycloak
      - path: /brp
        service: keycloak
        port: 8000
    tls: certificate
