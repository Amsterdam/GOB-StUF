# Default keyvault for getting secrets
keyVaultName: brpproxy-p-a6t2cjhdrwtg4

# Managed identity (clientId) for workload identity with (brpproxy-app-p)
workloadIdentity: 99699a15-3e6b-4042-b6b0-0f41b4c8e225

image:
  repository: brpproxy/gobstuf

# We must select the nodepool to run the pods on
nodepool: cccbenkprd01

# Specify the keyvault that has the prod certificate
secrets:
  certificate:
    keyVaultName: shared-p-c7s2mdnnmnrxo

deployments:
  api:
    env:
      ROUTE_NETLOC: mks01.amsterdam.nl:8443
      OAUTH2_PROXY_WHITELIST_DOMAINS: benk.azure.amsterdam.nl,bp.data.amsterdam.nl

# Default host for the ingress resources
host: brpproxy.benk.azure.amsterdam.nl

# Define hosts for external and internal ingress
ingress:
  backend-external:
    host: bp.data.amsterdam.nl
    className: nginx-external
    annotations:
      # OAuth callbacks fail if not set > 4k (default)
      # https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_buffer_size
      nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
      # Shows outgoing ip for appgw, needs header rewrite
      nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
      nginx.ingress.kubernetes.io/compute-full-forwarded-for: "true"
    paths:
      # Entra ID
      - path: /entra/brp
        service: entra
        port: 7999
      # Keycloak
      - path: /brp
        service: keycloak
        port: 8000
    tls: certificate

  # Remove once Wonen migrated to benk.azure.amsterdam.nl
  backend-internal:
    host: bp.data.amsterdam.nl
    className: nginx-internal
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
      nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
      nginx.ingress.kubernetes.io/compute-full-forwarded-for: "true"
    paths:
      # Entra ID
      - path: /entra/brp
        service: entra
        port: 7999
      # Keycloak
      - path: /brp
        service: keycloak
        port: 8000
    tls: certificate

  backend-internal-ads:
    host: benk.azure.amsterdam.nl
    className: nginx-internal
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
      nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
      nginx.ingress.kubernetes.io/compute-full-forwarded-for: "true"
    paths:
      # Entra ID
      - path: /entra/brp
        service: entra
        port: 7999
      # Keycloak
      - path: /brp
        service: keycloak
        port: 8000
    tls: certificate
