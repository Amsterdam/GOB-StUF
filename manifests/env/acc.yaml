# Default keyvault for getting secrets
keyVaultName: brpproxy-a-qmwocolamutd2

# Managed identity (clientId) for workload identity with
workloadIdentity: c5510b7e-6bec-4c07-a2af-6788d274fb52

image:
  repository: brpproxy/gobstuf

# We must select the nodepool to run the pods on
nodepool: cccbenkacc01

# Default host for the ingress resources
host: brpproxy.benk-a.azure.amsterdam.nl

# Specify the keyvault that has the certificate
secrets:
  certificate:
    keyVaultName: shared-a-iaecdpzoozlqc

deployments:
  api:
    env:
      ROUTE_NETLOC: mks01.acc.amsterdam.nl:8443
      OAUTH2_PROXY_WHITELIST_DOMAINS: brpproxy.benk-a.azure.amsterdam.nl,*.acc.bp.data.amsterdam.nl

# override host for external and internal ingress
ingress:
  backend-external:
    host: acc.bp.data.amsterdam.nl
    className: nginx-external
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /brp/$2

      # oauth callbacks fail if not set > 4k (default)
      # https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_buffer_size
      nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
    paths:
      - path: /brp(/|$)(.*)
        service: api
        port: 8000
    tls: certificate

  # Listener in use by WONEN
  backend-internal:
    host: acc.bp.data.amsterdam.nl

  backend-internal-benk-a:
    host: brpproxy.benk-a.azure.amsterdam.nl
    className: nginx-internal
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /brp/$2
      nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
    paths:
      - path: /brp(/|$)(.*)
        service: api
        port: 8000
    tls: certificate
