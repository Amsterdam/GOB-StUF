# Default keyvault for getting secrets
keyVaultName: brpproxy-a-qmwocolamutd2

# Managed identity (clientId) for workload identity with
workloadIdentity: c5510b7e-6bec-4c07-a2af-6788d274fb52

image:
  repository: brpproxy/gobstuf

# We must select the nodepool to run the pods on
nodepool: cccbenkacc01

# Default host for the ingress resources
host: brpproxy.benk-a.azure.amsterdam.nl

# Specify the keyvault that has the certificate
secrets:
  certificate:
    keyVaultName: shared-a-iaecdpzoozlqc

  vault:
    type: keyvault
    annotations:
      helm.sh/hook-weight: "-5"
    secrets:
      # Keycloak (used as env var by proxy)
      - oauth2-proxy-client-id
      - oauth2-proxy-client-secret
      - oauth2-proxy-cookie-secret
      - oauth2-proxy-oidc-issuer-url

      # Entra ID (used in oauth2-proxy-entra.yml)
      - oauth2-proxy-entra-client-id
      - oauth2-proxy-entra-client-secret
      - oauth2-proxy-entra-cookie-secret
      - oauth2-proxy-entra-oidc-issuer-url

deployments:
  api:
    env:
      ROUTE_NETLOC: mks01.acc.amsterdam.nl:8443
      OAUTH2_PROXY_WHITELIST_DOMAINS: brpproxy.benk-a.azure.amsterdam.nl,*.acc.bp.data.amsterdam.nl

services:
  entra:
    selector:
      component: api
    ports:
      - name: entra
        protocol: TCP
        port: 7999
        targetPort: entra
  keycloak:
    selector:
      component: api
    ports:
      - name: keycloak
        port: 8000
        targetPort: keycloak

# Override host for external and internal ingress
ingress:
  backend-external:
    host: acc.bp.data.amsterdam.nl
    className: nginx-external
    annotations:
      # OAuth callbacks fail if not set > 4k (default)
      # https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_buffer_size
      nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
      # Shows outgoing ip for appgw, needs header rewrite
      nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
      nginx.ingress.kubernetes.io/compute-full-forwarded-for: "true"
    paths:
      # Entra ID
      - path: /entra/brp
        service: entra
        port: 7999
      # Keycloak
      - path: /brp
        service: keycloak
        port: 8000
    tls: certificate

  # Listener in use by WONEN
  backend-internal:
    host: acc.bp.data.amsterdam.nl
    className: nginx-internal
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
      nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
      nginx.ingress.kubernetes.io/compute-full-forwarded-for: "true"
    paths:
      # Entra ID
      - path: /entra/brp
        service: entra
        port: 7999
      # Keycloak
      - path: /brp
        service: keycloak
        port: 8000
    tls: certificate

  backend-internal-benk-a:
    host: brpproxy.benk-a.azure.amsterdam.nl
    className: nginx-internal
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
      nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
      nginx.ingress.kubernetes.io/compute-full-forwarded-for: "true"
    paths:
      # Entra ID
      - path: /entra/brp
        service: entra
        port: 7999
      # Keycloak
      - path: /brp
        service: keycloak
        port: 8000
    tls: certificate
