fullnameOverride: brpproxy
tenantId: 72fca1b1-2c2e-4376-a445-294d80196804

image:
  registry: saks01weuacrpgpgo5qvmwo.azurecr.io
  repository: brpproxy/gobstuf
  tag: latest

labels:
  app: brpproxy

network:
  allow-ingress:
    annotations:
      helm.sh/hook-weight: "-5"
    selector: app == 'brpproxy'
    ingress:
      - action: Allow
    egress:
      - action: Allow

secrets:
  certificate:
    type: keyvault
    tls: brpproxy

  mks-certificate:
    type: keyvault
    tls: mks-certificate

  vault:
    type: keyvault
    annotations:
      helm.sh/hook-weight: "-5"
    secrets:
      - oauth2-proxy-client-id
      - oauth2-proxy-client-secret
      - oauth2-proxy-cookie-secret
      - oauth2-proxy-oidc-issuer-url
      - oauth2-proxy-redirect-url

jobs:

  certificate-init:
    annotations:
      helm.sh/hook: post-install,post-upgrade
    labels:
      component: certificate
    secrets:
      - certificate
    containers:
      - name: main
        command:
          - sleep
        args:
          - "1"

deployments:
  api:
    selectorLabels:
      component: api
    env:
      ROUTE_PATH_310: /CGS/StUF/0301/BG/0310/services/BeantwoordVraag
      ROUTE_PATH_204: /CGS/StUF/services/BGSynchroon
      UWSGI_HTTP: ":8001"
      UWSGI_MODULE: "gobstuf.wsgi"
      UWSGI_CALLABLE: "app"
      UWSGI_HARAKIRI: "3600"
      UWSGI_PROCESSES: "4"
      UWSGI_ENABLE_THREADS: ""
      UWSGI_MAX_WORKER_LIFETIME: "1800"
      UWSGI_ATTACH_DAEMON2: "cmd=./oauth2-proxy --config oauth2-proxy.cfg,freq=3,control=true,stopsignal=15"
      UWSGI_HTTP_TIMEOUT: "4000"
      UWSGI_BUFFER_SIZE: "8192"
      UWSGI_DIE_ON_TERM: "1"
      UWSGI_NEED_APP: "1"
    autoscale:
      cpu: 90
      memory: 70
      max: 10
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi
    containers:
      - name: main
        secrets:
          - vault
          - mks-certificate
        tempDirs:
          - /tmp
        ports:
          - port: 8000
            name: http
services:
  api:
    selector:
      component: api
    ports:
      - port: 8000
        targetPort: http

ingress:
  backend-external:
    className: nginx-external
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /brp/$2
    paths:
      - path: /brp(/|$)(.*)
        service: api
        port: 8000
    tls: certificate

  backend-internal:
    className: nginx-internal
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /brp/$2
    paths:
      - path: /brp(/|$)(.*)
        service: api
        port: 8000
    tls: certificate
