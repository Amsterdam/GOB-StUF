trigger: none
pr: none


resources:
  repositories:
    - repository: templates
      type: github
      endpoint: Amsterdam
      name: Amsterdam/common-azure-pipelines
      ref: main

extends:
  template: pipelines/aks/template.yaml@templates
  parameters:
    name: brpproxy-api
    variables:
      repository: brpproxy/gobstuf
    dev:
      pool: Selfhosted Azure Devops Agents
      devopsEnvironment: brpproxy-dev
      namespace: ns-ccc-benk-ont-01-brpproxy-aks
      kubernetesServiceConnection: SCN-K8S-ns-ccc-benk-ont-01-brpproxy-aks
