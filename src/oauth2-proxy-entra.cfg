# https://oauth2-proxy.github.io/oauth2-proxy/configuration/overview/#cookie-options
cookie_expire="15m"
cookie_httponly="true"
cookie_name="_oauth2_proxy_entra"
cookie_path="/entra"
cookie_refresh="0"
cookie_samesite="none"
cookie_secure="true"
email_domains="*"
encode_state="true"
footer="-"
proxy_prefix="/entra/brp/oauth"
skip_auth_routes="GET=^/entra/brp/status/health"
skip_jwt_bearer_tokens="true"
skip_provider_button="true"
