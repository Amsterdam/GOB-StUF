# https://oauth2-proxy.github.io/oauth2-proxy/configuration/overview/#config-options
cookie_expire="15m"
cookie_httponly="true"
cookie_refresh="0"
cookie_samesite="none"
cookie_secure="true"
email_domains="*"
encode_state="true"
footer="-"
proxy_prefix="/brp/oauth"
real_client_ip_header="X-Forwarded-For"
reverse_proxy="true"
scope="openid profile roles"
set_xauthrequest="false"
skip_auth_preflight="true"
skip_auth_routes="GET=^/brp/status/health"
skip_jwt_bearer_tokens="true"
skip_provider_button="true"
