# https://oauth2-proxy.github.io/oauth2-proxy/configuration/overview/#config-options
allowed_roles="brp_r"
code_challenge_method="S256"
cookie_expire="15m"
cookie_httponly="true"
cookie_refresh="0"
cookie_samesite="strict"
cookie_secure="true"
email_domains="*"
encode_state="true"
footer="-"
http_address="0.0.0.0:7999"
insecure_oidc_allow_unverified_email="true"
oidc_email_claim="preferred_username"
oidc_extra_audiences="account"
pass_access_token="true"
pass_basic_auth="false"
provider="keycloak-oidc"
proxy_prefix="/brp/oauth"
real_client_ip_header="X-Forwarded-For"
reverse_proxy="true"
scope="openid profile roles"
set_xauthrequest="false"
skip_auth_preflight="true"
skip_auth_routes="GET=^/brp/status/health"
skip_auth_strip_headers="true"
skip_jwt_bearer_tokens="true"
skip_provider_button="true"
upstreams="http://127.0.0.1:8001/"
