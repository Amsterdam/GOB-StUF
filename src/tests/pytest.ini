[pytest]
cache_dir = /tmp/.pytest_cache
addopts = --capture=no
env =
    API_BASE_PATH=/gob_stuf_test
    ENTRA_BASE_PATH=/entra
    ROUTE_PATH_310=/310
    ROUTE_PATH_204=/204
    ROUTE_SCHEME=http
    ROUTE_NETLOC=gob-stuf-tests:1234
    GOB_STUF_PORT=8000
    CLIENT_CERT_CRT=cert.crt
    CLIENT_CERT_KEY=cert.key
